[project]
name = "student-portal"
version = "0.3.0"
description = "Система управління студентами"
readme = "README.md"
authors = [
    { name = "Козелко Віталій" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
student-portal = "student_portal:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.mypy]
strict = true
