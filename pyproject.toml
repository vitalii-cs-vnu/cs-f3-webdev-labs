[project]
name = "student-portal"
version = "0.3.0"
description = "Система управління студентами"
readme = "README.md"
authors = [
    { name = "Козелко Віталій" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
student-portal = "student_portal:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.1",
]

[tool.mypy]
strict = true

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true

[tool.coverage.run]
branch = true
source = ["student_portal"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
